<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Weather</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            background: #f5f5f5;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        .search-box select {
            padding: 8px;
            width: 70%;
        }
        .weather-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .zoo-name {
            font-size: 1.2rem;
            color: #2c8437;
            margin: 0;
        }
        .zoo-location {
            color: #666;
            margin: 5px 0;
        }
        .weather-info {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .weather-temp {
            font-size: 2rem;
            margin-right: 20px;
        }
        .weather-details p {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="zoos.html">Zoos</a>
            <a href="weather.html">Weather</a>
        </nav>
    </header>

    <main class="container">
        <h1>Zoo Weather</h1>
        
        <div class="search-box">
            <select id="zoo-select">
                <option value="">All Zoos</option>
                <option value="delhi">Delhi Zoo</option>
                <option value="chennai">Chennai Zoo</option>
                <option value="mysuru">Mysuru Zoo</option>
            </select>
        </div>
        
        <div id="weather-container">
            <div class="weather-card">
                <h3 class="zoo-name">Delhi Zoo</h3>
                <p class="zoo-location">New Delhi</p>
                <div class="weather-info">
                    <div class="weather-temp">32°C</div>
                    <div>
                        <p>Sunny</p>
                        <p>Feels like 34°C</p>
                    </div>
                </div>
                <div class="weather-details">
                    <p><span>Humidity:</span> <span>45%</span></p>
                    <p><span>Wind:</span> <span>10 km/h</span></p>
                </div>
            </div>
            
            <div class="weather-card">
                <h3 class="zoo-name">Chennai Zoo</h3>
                <p class="zoo-location">Chennai</p>
                <div class="weather-info">
                    <div class="weather-temp">35°C</div>
                    <div>
                        <p>Partly Cloudy</p>
                        <p>Feels like 38°C</p>
                    </div>
                </div>
                <div class="weather-details">
                    <p><span>Humidity:</span> <span>65%</span></p>
                    <p><span>Wind:</span> <span>12 km/h</span></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Zoography</p>
    </footer>

    <script>
        document.getElementById('zoo-select').addEventListener('change', function() {
            const selectedZoo = this.value;
            const cards = document.querySelectorAll('.weather-card');
            
            cards.forEach(card => {
                if (!selectedZoo || card.querySelector('.zoo-name').textContent.includes(selectedZoo)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
